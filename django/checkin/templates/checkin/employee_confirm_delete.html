{% extends 'checkin/base.html' %}
{% block title %}Delete {{ employee.employee_name }} • Face Check-In{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body text-center">
        <h3>Delete Employee</h3>
        <p class="text-muted">Are you sure you want to delete <strong>{{ employee.employee_name }}</strong> ({{ employee.employee_id }})?</p>
        <form method="post">
          {% csrf_token %}
          <a href="{% url 'checkin:employee_list' %}" class="btn btn-link">Cancel</a>
          <button type="submit" class="btn btn-danger">Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
